<!-- ========================================
     TEMPLATE MINIMAL - Mode d'emploi
     Point de départ pour toute nouvelle page. Les blocs head / bandeau / menu / pied de page
     (bandeau, menu, pied de page) sont remplis par generer_blocs.py ; le <head> est à adapter à la main (modèle : includes/head.html).
     ======================================== -->

<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- Remplacez les contenus entre [...] pour chaque page -->

    <!-- Bandeau cookies + Google Analytics 4 (chargé seulement après consentement) : voir cookies.js.
         La langue du bandeau suit l'attribut lang de <html> (fr, en, de, nl). -->
    <script src="cookies.js" defer></script>

    <meta charset="UTF-8">
    <meta name="robots" content="index, follow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Titre de la page (personnalisé) -->
    <title>[TITRE DE LA PAGE - Exemple: Accueil | Le Relais de Chaumeré]</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="includes/components.css">
    <script src="header-scroll.js" defer></script>

    <!-- À PERSONNALISER PAR PAGE -->
    <meta name="description" content="[DESCRIPTION COURTE DE LA PAGE - max 160 caractères]">
    <link rel="canonical" href="https://www.le-relais-de-chaumere.fr/[nom-de-la-page].html">

    <meta property="og:type" content="website">
    <meta property="og:title" content="[TITRE]">
    <meta property="og:description" content="[DESCRIPTION]">
    <meta property="og:image" content="https://www.le-relais-de-chaumere.fr/[chemin-image-1200x630].jpg">
    <meta property="og:url" content="https://www.le-relais-de-chaumere.fr/[nom-de-la-page].html">
    <meta property="og:locale" content="fr_FR">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Hreflang : seulement si la page a des traductions (accueil, offre, tarifs, tourisme, contact).
         Chaque version doit lister les 4 langues, plus x-default (français). -->
    <link rel="alternate" hreflang="fr" href="https://www.le-relais-de-chaumere.fr/[nom-de-la-page].html">
    <link rel="alternate" hreflang="en" href="https://www.le-relais-de-chaumere.fr/[page-en-anglais].html">
    <link rel="alternate" hreflang="de" href="https://www.le-relais-de-chaumere.fr/[page-en-allemand].html">
    <link rel="alternate" hreflang="nl" href="https://www.le-relais-de-chaumere.fr/[page-en-neerlandais].html">
    <link rel="alternate" hreflang="x-default" href="https://www.le-relais-de-chaumere.fr/[nom-de-la-page].html">

    <!-- Ne PAS ajouter de bloc <style> ni de style="..." : créer une classe dans style.css
         (styles propres à une seule page : préfixer par la classe du <body>, ex. body.page-ma-page). -->
</head>
<body>

<!-- Bandeau chantier et menu : ne rien écrire ici, `python3 generer_blocs.py` remplit les blocs entre marqueurs. -->
<!-- BLOC:bandeau -->
<!-- /BLOC:bandeau -->

<!-- BLOC:menu -->
<!-- /BLOC:menu -->

<!-- Contenu principal -->
<main>
    <!-- VOTRE CONTENU ICI -->
    <h1>[Titre de la page]</h1>
    <p>Contenu spécifique...</p>
</main>

<!-- Pied de page : rempli par generer_blocs.py (date du jour comprise) -->
<!-- BLOC:pied -->
<!-- /BLOC:pied -->

</body>
</html>

<!--
========================================
INSTRUCTIONS D'UTILISATION :
========================================

1. Personnalisation du <title> et des meta tags pour CHAQUE page.

2. Bandeau, menu (avec sélecteur de langue) et pied de page : garder les marqueurs BLOC ci-dessus puis lancer `python3 generer_blocs.py` depuis la racine. Pour qu'un lien du menu soit actif sur la nouvelle page, l'ajouter dans la table du script (ou mettre à la main aria-current="page" et class="active" avant le premier lancement).

3. Meta personnalisées (description, og:title, og:image, canonical) : chaque page a sa propre
   description SEO ; les images OG doivent faire 1200x630px.

4. Bandeau cookies et Google Analytics : rien à copier, cookies.js s'en charge (GA4 uniquement,
   GTM supprimé définitivement). Le pied de page ne contient plus de bandeau cookies.

5. Date du pied de page : générée par le script ; elle ne change que pour les pages dont un bloc a changé. Pour une modification de contenu, relancer `python3 generer_blocs.py` ne suffit pas : mettre la date du jour à la main (JJ/MM/AAAA).

6. Nouvelle page : l'ajouter à sitemap.xml et la lier depuis au moins une page hub.

7. Page traduite (en/de/nl) : écrire les 3 versions, relier par hreflang et par le sélecteur
   de langue, et répercuter à la main toute modification ultérieure dans les 4 versions.
========================================
-->
