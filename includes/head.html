<!-- ========================================
     COMPOSANT HEAD - Meta tags + bandeau cookies / Google Analytics
     (référence à copier : ce fichier n'est PAS inclus automatiquement)
     ======================================== -->

<!-- Bandeau cookies + Google Analytics 4 (chargé seulement après consentement) : voir cookies.js -->
<script src="cookies.js" defer></script>

<meta charset="UTF-8">
<meta name="robots" content="index, follow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<script src="header-scroll.js" defer></script>

<!-- À PERSONNALISER PAR PAGE -->
<!-- Remplacez les valeurs ci-dessous pour chaque page -->
<meta name="description" content="[À REMPLIR - description courte de la page]">
<link rel="canonical" href="[À REMPLIR - URL complète de la page]">

<meta property="og:type" content="website">
<meta property="og:title" content="[À REMPLIR - Titre]">
<meta property="og:description" content="[À REMPLIR - Description]">
<meta property="og:image" content="[À REMPLIR - Image 1200x630px]">
<meta property="og:url" content="[À REMPLIR - URL de la page]">
<meta property="og:locale" content="fr_FR">
<meta name="twitter:card" content="summary_large_image">

<!-- Hreflang : à garder pour les 5 pages traduites (accueil, offre, tarifs, tourisme, contact) ;
     une page sans traduction n'en a pas besoin. Exemple pour offre.html : -->
<link rel="alternate" hreflang="fr" href="https://www.le-relais-de-chaumere.fr/offre.html">
<link rel="alternate" hreflang="en" href="https://www.le-relais-de-chaumere.fr/offer.html">
<link rel="alternate" hreflang="de" href="https://www.le-relais-de-chaumere.fr/angebot.html">
<link rel="alternate" hreflang="nl" href="https://www.le-relais-de-chaumere.fr/aanbod.html">
<link rel="alternate" hreflang="x-default" href="https://www.le-relais-de-chaumere.fr/offre.html">
